name: Mirror to evandromengue

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  create:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to evandromengue
        run: |
          git push --mirror "https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/evandromengue/${{ github.event.repository.name }}.git"
